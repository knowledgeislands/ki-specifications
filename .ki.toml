# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = [
  "knowledgeislands/ki-agent-backpack",
]

[skills.ki-repo]
repo_type = "project"
primary_shape = "ki-repo-specifications"
repository = "https://github.com/knowledgeislands/ki-specifications"
title = "Knowledge Islands Specifications"
capital = "https://github.com/knowledgeislands/ki-principal"
description = "Pre-v1 holding repository for future Knowledge Islands-wide specifications; repository-level specifications remain local."
repo_code = "KI-SPEC"
supported_runtimes = [
  "claude-code",
  "claude-desktop",
  "chatgpt-codex",
]
visibility = "public"
license = "MIT"

[skills.ki-authoring]

