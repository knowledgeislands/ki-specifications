            <text x="220" y="138" font-size="10px" font-weight="500" fill="#5b6474" stop-color="#000000">waiting</text>
          </g>
          <g data-legend-semantic-kind="success" data-legend-x="307" data-legend-baseline="138" data-legend-width="87" stop-color="#000000">
