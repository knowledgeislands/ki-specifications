          <g aria-hidden="true" data-lifecycle-initial-marker="" stop-color="#000000"><circle cx="30" cy="60" r="4.5" fill="#059669" stop-color="#000000"/><path d="M 34.5 60 L 49 60" stroke-width="1.4px" fill="none" stroke="#059669" stop-color="#000000"/><path d="M 48 56.5 L 55 60 L 48 63.5 Z" fill="#059669" stop-color="#000000"/></g>
          
