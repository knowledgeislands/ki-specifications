            <text x="74" y="138" font-size="10px" font-weight="500" fill="#5b6474" stop-color="#000000">initial state</text>
          </g>
          <g data-legend-semantic-kind="waiting" data-legend-x="198" data-legend-baseline="138" data-legend-width="87" stop-color="#000000">
