          <path data-edge-from="draft" data-edge-to="active" data-edge-label="implementation experience" data-edge-key="0" data-edge-id="draft-active" data-composition-points="262,60;450,60" data-composition-crossover="halo" data-composition-independent="true" d="M 262 60 L 450 60" data-animate="edge" stroke-width="1.8px" marker-end="url(#arrowhead-emphasis)" fill="none" stroke="#059669" stop-color="#000000"/>
        </g>
        <g data-graph-role="automatic-crossover" stop-color="#000000">
          <path data-graph-role="automatic-crossover-underlay" d="M 624 60 L 770 60" fill="none" stroke="#ffffff" stroke-width="5.8px" stroke-linecap="round" stroke-linejoin="round" pointer-events="none" stop-color="#000000"/>
          <path data-edge-from="active" data-edge-to="deprecated" data-edge-label="successor intended" data-edge-key="1" data-edge-id="active-deprecated" data-composition-points="624,60;770,60" data-composition-crossover="halo" data-composition-independent="true" d="M 624 60 L 770 60" data-animate="edge" stroke-width="1.8px" marker-end="url(#arrowhead-emphasis)" fill="none" stroke="#059669" stop-color="#000000"/>
        </g>
