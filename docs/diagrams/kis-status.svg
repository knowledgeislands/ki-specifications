        </g>

        <g id="node-active" data-node-id="active" data-node-label="Active" tabindex="0" role="button" aria-label="Focus Active, proven by implementation, Lifecycle state" aria-pressed="false" data-node-kind="success" data-node-sublabel="proven by implementation" data-node-context="Lifecycle state" stop-color="#000000">
          <title stop-color="#000000">Active · proven by implementation · Lifecycle state</title>
