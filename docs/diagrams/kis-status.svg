          <path data-graph-role="automatic-crossover-underlay" d="M 924 60 L 1058 60" fill="none" stroke="#ffffff" stroke-width="5.8px" stroke-linecap="round" stroke-linejoin="round" pointer-events="none" stop-color="#000000"/>
          <path data-edge-from="deprecated" data-edge-to="superseded" data-edge-label="successor Active" data-edge-key="2" data-edge-id="deprecated-superseded" data-composition-points="924,60;1058,60" data-composition-crossover="halo" data-composition-independent="true" d="M 924 60 L 1058 60" data-animate="edge" stroke-width="1.8px" marker-end="url(#arrowhead-emphasis)" fill="none" stroke="#059669" stop-color="#000000"/>
        </g>


        <!-- States -->
        <g id="node-draft" data-node-id="draft" data-node-label="Draft" tabindex="0" role="button" aria-label="Focus Draft, published from an accepted KIP, Lifecycle state" aria-pressed="false" data-node-kind="start" data-node-sublabel="published from an accepted KIP" data-node-context="Lifecycle state" stop-color="#000000">
