          <text data-node-label="" x="1142.5" y="51" font-size="12px" font-weight="600" text-anchor="middle" fill="#111827" stop-color="#000000">Superseded</text>
          <text x="1142.5" y="68" font-size="9px" text-anchor="middle" fill="#5b6474" stop-color="#000000">successor KIS is Active</text>
          <text x="1142.5" y="83" font-size="8px" text-anchor="middle" fill="#5b6474" stop-color="#000000">terminal</text>
        </g>

        <!-- Transition labels -->
        <g data-edge-from="draft" data-edge-to="active" data-edge-label="implementation experience" data-edge-key="0" data-edge-id="draft-active" stop-color="#000000">
