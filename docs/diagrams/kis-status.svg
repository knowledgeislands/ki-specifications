<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1283 170" data-reader-fit="intrinsic-height" data-lifecycle-layout="main-path-v3" role="img" lang="en" aria-labelledby="archify-diagram-title archify-diagram-description" data-preset="classic" data-quality-profile="showcase" data-motion-choreography="walk" width="1283" height="170" data-theme="light" fill="#000000" stop-color="#000000" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;DejaVu Sans Mono&quot;, &quot;Liberation Mono&quot;, monospace"><rect x="0" y="0" width="1283" height="170" fill="#f4f5f7" stop-color="#000000"/>
        <title id="archify-diagram-title" stop-color="#000000">KIS status flow</title>
        <desc id="archify-diagram-description" stop-color="#000000">The statuses a Knowledge Islands Specification moves through, from Draft to Superseded</desc>
        <!-- Definitions -->
        <defs stop-color="#000000">
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" stop-color="#000000">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" stop-color="#000000"/>
          </marker>
          <marker id="arrowhead-emphasis" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" stop-color="#000000">
            <polygon points="0 0, 10 3.5, 0 7" fill="#059669" stop-color="#000000"/>
          </marker>
          <marker id="arrowhead-security" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" stop-color="#000000">
            <polygon points="0 0, 10 3.5, 0 7" fill="#e11d48" stop-color="#000000"/>
          </marker>
          <marker id="arrowhead-dashed" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" stop-color="#000000">
            <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed" stop-color="#000000"/>
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" stop-color="#000000">
            <path d="M 40 0 L 0 0 0 40" stroke-width="0.5px" fill="none" stroke="#e9edf2" stop-color="#000000"/>
          </pattern>
        </defs>

        <!-- Background Grid -->
        <rect width="100%" height="100%" fill="url(#grid)" stop-color="#000000"/>

        <!-- Composite phases -->


        <!-- Transition paths -->
        <g data-graph-role="automatic-crossover" stop-color="#000000">
