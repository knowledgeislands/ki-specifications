            <path d="M4 2.5h8M4 13.5h8M5 3c0 2.8 2 3.2 3 5-1 1.8-3 2.2-3 5M11 3c0 2.8-2 3.2-3 5 1 1.8 3 2.2 3 5" stop-color="#000000"/>
          </g>
          <text x="793" y="42" font-size="8px" font-weight="700" fill="#d97706" stop-color="#000000">03</text>
          <text data-node-label="" x="846" y="55" font-size="12px" font-weight="600" text-anchor="middle" fill="#111827" stop-color="#000000">Deprecated</text>
          <text x="847" y="73" font-size="9px" text-anchor="middle" fill="#5b6474" stop-color="#000000">not for new work</text>
        </g>

        <g id="node-superseded" data-node-id="superseded" data-node-label="Superseded" tabindex="0" role="button" aria-label="Focus Superseded, successor KIS is Active, Lifecycle state" aria-pressed="false" data-node-kind="neutral" data-node-sublabel="successor KIS is Active" data-node-tag="terminal" data-node-context="Lifecycle state" stop-color="#000000">
          <title stop-color="#000000">Superseded · successor KIS is Active · Lifecycle state · terminal</title>
          <rect x="1058" y="28" width="169" height="64" rx="8" fill="#ffffff" stop-color="#000000"/>
          <rect x="1058" y="28" width="169" height="64" rx="8" data-animate="node" stroke-width="1.5px" fill="#96a1b7" fill-opacity="0.18" stroke="#64748b" stop-color="#000000"/>
          <rect x="1061" y="31" width="163" height="58" rx="5" stroke-width="1" fill="none" stroke="#64748b" stop-color="#000000"/>
          <g aria-hidden="true" data-semantic-sigil="stop" transform="translate(1064 34) scale(0.6875)" fill="none" stroke="#64748b" stroke-width="1.35px" stroke-linecap="round" stroke-linejoin="round" opacity="0.76" stop-color="#000000">
            <circle cx="8" cy="8" r="5.3" stop-color="#000000"/>
